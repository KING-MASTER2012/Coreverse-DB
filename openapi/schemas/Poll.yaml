type: object
required:
  - id
  - question
  - options
properties:
  id:
    type: string
    format: uuid
  question:
    type: string
  closes_at:
    type: string
    format: date-time
    type: ["string", "null"]
  options:
    type: array
    items:
      type: object
      required: [id, label]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        display_order: { type: integer }
