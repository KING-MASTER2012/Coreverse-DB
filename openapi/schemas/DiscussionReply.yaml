type: object
required:
  - id
  - discussion_id
  - author_id
properties:
  id:
    type: string
    format: uuid
  discussion_id:
    type: string
    format: uuid
  author_id:
    type: string
    format: uuid
  body:
    type: string
    type: ["string", "null"]
    description: null/omitted when deleted_at is set -- render as "[deleted]".
  deleted_at:
    type: string
    format: date-time
    type: ["string", "null"]
  created_at:
    type: string
    format: date-time
