type: object
required:
  - id
  - discussion_id
  - author_id
properties:
  id:
    type: string
    format: uuid
  discussion_id:
    type: string
    format: uuid
  author_id:
    type: string
    format: uuid
  body:
    type: string
    nullable: true
    description: null/omitted when deleted_at is set -- render as "[deleted]".
  deleted_at:
    type: string
    format: date-time
    nullable: true
  created_at:
    type: string
    format: date-time
