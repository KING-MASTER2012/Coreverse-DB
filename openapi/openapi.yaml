# yaml-language-server: $schema=https://spec.openapis.org/oas/3.1/schema/2025-09-15
openapi: 3.1.0
info:
  title: Coreverse DB API
  description: >
    Centralized data-access API for the Coreverse ecosystem. Coreverse DB
    defines and serves all data operations; Coreverse Launcher and
    Coreverse Website consume this API and never access Postgres/Supabase
    directly.
  version: 0.1.0
  license:
    name: GPL-3.0-only
servers:
  - url: https://wsbahvnrttaepnabnbqn.supabase.co/functions/v1
    description: Supabase Edge Functions (production)
  - url: http://127.0.0.1:54321/functions/v1
    description: Local development (supabase start)
tags:
  - name: releases
    description: Coreverse Engine release metadata and per-platform artifacts.
  - name: teams
    description: Teams, membership, roles, and bidirectional join/invite/ownership-transfer requests.
  - name: requests
    description: Responding to (accept/reject) or cancelling a pending membership request.
  - name: profiles
    description: The caller's own profile.
  - name: projects
    description: User-uploaded project archives (metadata only -- files live in Storage).
  - name: news
    description: Platform news (moderator/admin write, public read of published items).
  - name: polls
    description: Polls with anonymous aggregated results.
  - name: discussions
    description: Community discussions and replies.
  - name: docs
    description: Documentation catalog and full-text search (index only -- pages are read from their own base_url).
paths:
  /releases:
    $ref: './paths/releases.yaml#/list'
  /releases/latest:
    $ref: './paths/releases.yaml#/latest'
  /releases/{version}:
    $ref: './paths/releases.yaml#/byVersion'
  /teams:
    $ref: './paths/teams.yaml#/create'
  /teams/{teamId}:
    $ref: './paths/teams.yaml#/byId'
  /teams/{teamId}/members:
    $ref: './paths/teams.yaml#/members'
  /teams/{teamId}/members/{userId}:
    $ref: './paths/teams.yaml#/memberAction'
  /teams/{teamId}/join-requests:
    $ref: './paths/teams.yaml#/joinRequests'
  /teams/{teamId}/invites:
    $ref: './paths/teams.yaml#/invites'
  /teams/{teamId}/ownership-transfer:
    $ref: './paths/teams.yaml#/ownershipTransfer'
  /teams/{teamId}/leave:
    $ref: './paths/teams.yaml#/leave'
  /requests/{requestId}/accept:
    $ref: './paths/requests.yaml#/accept'
  /requests/{requestId}/reject:
    $ref: './paths/requests.yaml#/reject'
  /requests/{requestId}/cancel:
    $ref: './paths/requests.yaml#/cancel'
  /profiles/me:
    $ref: './paths/profiles.yaml#/me'
  /projects:
    $ref: './paths/projects.yaml#/list'
  /projects/{projectId}:
    $ref: './paths/projects.yaml#/byId'
  /projects/{projectId}/download:
    $ref: './paths/projects.yaml#/download'
  /news:
    $ref: './paths/news.yaml#/list'
  /news/{newsId}:
    $ref: './paths/news.yaml#/byId'
  /polls:
    $ref: './paths/polls.yaml#/list'
  /polls/{pollId}/vote:
    $ref: './paths/polls.yaml#/vote'
  /polls/{pollId}/results:
    $ref: './paths/polls.yaml#/results'
  /discussions:
    $ref: './paths/discussions.yaml#/list'
  /discussions/{discussionId}:
    $ref: './paths/discussions.yaml#/byId'
  /discussions/{discussionId}/replies:
    $ref: './paths/discussions.yaml#/replies'
  /replies/{replyId}:
    $ref: './paths/discussions.yaml#/replyById'
  /docs/sources:
    $ref: './paths/docs.yaml#/sources'
  /docs/search:
    $ref: './paths/docs.yaml#/search'
  /docs/reindex:
    $ref: './paths/docs.yaml#/reindex'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Supabase Auth JWT for the calling user, forwarded as the
        Authorization header. Edge Functions build a per-request Supabase
        client from this token (see
        supabase/functions/_shared/supabase-client.ts) so RLS and
        SECURITY DEFINER functions evaluate auth.uid() correctly.
        Operations without a `security` requirement are public reads;
        /docs/reindex uses a separate shared-secret header instead of a
        user JWT (see its `X-Reindex-Token` parameter).
  schemas:
    Ok:
      $ref: './schemas/Ok.yaml'
    Release:
      $ref: './schemas/Release.yaml'
    Artifact:
      $ref: './schemas/Artifact.yaml'
    Profile:
      $ref: './schemas/Profile.yaml'
    Team:
      $ref: './schemas/Team.yaml'
    TeamMember:
      $ref: './schemas/TeamMember.yaml'
    MembershipRequest:
      $ref: './schemas/MembershipRequest.yaml'
    Project:
      $ref: './schemas/Project.yaml'
    News:
      $ref: './schemas/News.yaml'
    Poll:
      $ref: './schemas/Poll.yaml'
    PollResult:
      $ref: './schemas/PollResult.yaml'
    Discussion:
      $ref: './schemas/Discussion.yaml'
    DiscussionReply:
      $ref: './schemas/DiscussionReply.yaml'
    DocSource:
      $ref: './schemas/DocSource.yaml'
    DocSearchResult:
      $ref: './schemas/DocSearchResult.yaml'
    Error:
      $ref: './schemas/Error.yaml'
