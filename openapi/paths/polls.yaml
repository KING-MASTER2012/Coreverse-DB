list:
  get:
    summary: List polls (with their options)
    operationId: listPolls
    tags: [polls]
    security: []
    responses:
      '200':
        description: Polls.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/Poll.yaml'
  post:
    summary: Create a poll with its options (moderator/admin only)
    operationId: createPoll
    tags: [polls]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [question, options]
            properties:
              question: { type: string }
              closes_at: { type: string, format: date-time, type: ["string", "null"] }
              options:
                type: array
                minItems: 2
                items:
                  type: string
    responses:
      '201':
        description: Created poll.
        content:
          application/json:
            schema:
              $ref: '../schemas/Poll.yaml'
      '400':
        description: Invalid request body (e.g. fewer than 2 options).
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '403':
        description: Caller is not a moderator/admin (also returned when unauthenticated).
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'

vote:
  post:
    summary: Cast a vote (one per poll per user; rejected if the poll is closed)
    operationId: castVote
    tags: [polls]
    security:
      - bearerAuth: []
    parameters:
      - name: pollId
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [option_id]
            properties:
              option_id: { type: string, format: uuid }
    responses:
      '201':
        description: Vote recorded.
        content:
          application/json:
            schema:
              $ref: '../schemas/Ok.yaml'
      '400':
        description: Invalid poll id or request body.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '401':
        description: A valid session is required.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '409':
        description: Already voted, or the poll is closed.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'

results:
  get:
    summary: Get aggregated (anonymous) results for a poll
    operationId: getPollResults
    tags: [polls]
    security: []
    parameters:
      - name: pollId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: Vote counts per option.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/PollResult.yaml'
      '400':
        description: Invalid poll id.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
