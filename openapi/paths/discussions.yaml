list:
  get:
    summary: List discussions
    operationId: listDiscussions
    tags: [discussions]
    security: []
    parameters:
      - name: category
        in: query
        required: false
        schema: { type: string }
    responses:
      '200':
        description: Discussions.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/Discussion.yaml'
  post:
    summary: Start a discussion
    operationId: createDiscussion
    tags: [discussions]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title, body]
            properties:
              title: { type: string }
              body: { type: string }
              category: { type: string, nullable: true }
    responses:
      '201':
        description: Created discussion.
        content:
          application/json:
            schema:
              $ref: '../schemas/Discussion.yaml'
      '400':
        description: Invalid request body.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '401':
        description: A valid session is required.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'

byId:
  patch:
    summary: Update or lock/unlock a discussion (author while unlocked, or moderator)
    operationId: updateDiscussion
    tags: [discussions]
    security:
      - bearerAuth: []
    parameters:
      - name: discussionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title: { type: string }
              body: { type: string }
              is_locked: { type: boolean }
    responses:
      '200':
        description: Updated discussion.
        content:
          application/json:
            schema:
              $ref: '../schemas/Discussion.yaml'
      '400':
        description: Invalid discussion id or request body.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '403':
        description: Caller is neither the author (while unlocked) nor a moderator.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '404':
        description: No discussion with that id (or not authorized).
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
  delete:
    summary: Delete a discussion (author or moderator)
    operationId: deleteDiscussion
    tags: [discussions]
    security:
      - bearerAuth: []
    parameters:
      - name: discussionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '204':
        description: Deleted.
      '400':
        description: Invalid discussion id.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '404':
        description: No discussion with that id (or not authorized).
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'

replies:
  get:
    summary: List a discussion's replies
    operationId: listDiscussionReplies
    tags: [discussions]
    security: []
    parameters:
      - name: discussionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: Replies (including soft-deleted tombstones).
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/DiscussionReply.yaml'
      '400':
        description: Invalid discussion id.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
  post:
    summary: Reply to a discussion (rejected if the discussion is locked)
    operationId: replyToDiscussion
    tags: [discussions]
    security:
      - bearerAuth: []
    parameters:
      - name: discussionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [body]
            properties:
              body: { type: string }
    responses:
      '201':
        description: Created reply.
        content:
          application/json:
            schema:
              $ref: '../schemas/DiscussionReply.yaml'
      '400':
        description: Invalid discussion id or request body.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '401':
        description: A valid session is required.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '403':
        description: The discussion is locked.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'

replyById:
  patch:
    summary: Edit or soft-delete a reply (author or moderator)
    operationId: updateDiscussionReply
    tags: [discussions]
    security:
      - bearerAuth: []
    parameters:
      - name: replyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              body: { type: string }
              deleted: { type: boolean, description: Set true to soft-delete. }
    responses:
      '200':
        description: Updated reply.
        content:
          application/json:
            schema:
              $ref: '../schemas/DiscussionReply.yaml'
      '400':
        description: Invalid reply id or request body.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '403':
        description: Caller is neither the author nor a moderator.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '404':
        description: No reply with that id (or not authorized).
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
