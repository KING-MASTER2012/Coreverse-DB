list:
  get:
    summary: List engine releases
    operationId: listReleases
    tags: [releases]
    security: []
    parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [stable, beta, rc, deprecated]
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
    responses:
      '200':
        description: A page of releases, newest first.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/Release.yaml'
      '400':
        description: Invalid query parameters.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'

latest:
  get:
    summary: Get the latest release for a status channel
    operationId: getLatestRelease
    tags: [releases]
    security: []
    parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [stable, beta, rc, deprecated]
          default: stable
    responses:
      '200':
        description: The latest matching release.
        content:
          application/json:
            schema:
              $ref: '../schemas/Release.yaml'
      '404':
        description: No release found for the given status.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'

byVersion:
  get:
    summary: Get a release by exact version
    operationId: getReleaseByVersion
    tags: [releases]
    security: []
    parameters:
      - name: version
        in: path
        required: true
        schema:
          type: string
          pattern: '^\d+\.\d+\.\d+$'
    responses:
      '200':
        description: The matching release.
        content:
          application/json:
            schema:
              $ref: '../schemas/Release.yaml'
      '400':
        description: Malformed version string (expected MAJOR.MINOR.PATCH).
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '404':
        description: No release found for the given version.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
