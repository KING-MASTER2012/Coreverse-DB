list:
  get:
    summary: List news (published only, unless moderator or author)
    operationId: listNews
    tags: [news]
    security:
      - {}
      - bearerAuth: []
    description: >
      Anonymous and unrelated callers only see status=published. An
      authenticated caller who is the item's author or a platform
      moderator/admin also sees their own drafts (RLS: news_authenticated_read).
    parameters:
      - name: status
        in: query
        required: false
        schema: { type: string, enum: [draft, published] }
    responses:
      '200':
        description: News items.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/News.yaml'
      '400':
        description: Invalid status filter.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
  post:
    summary: Create a news item as a draft (moderator/admin only)
    operationId: createNews
    tags: [news]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title, slug, body]
            properties:
              title: { type: string }
              slug: { type: string }
              body: { type: string }
    responses:
      '201':
        description: Created (draft) news item.
        content:
          application/json:
            schema:
              $ref: '../schemas/News.yaml'
      '400':
        description: Invalid request body.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '401':
        description: A valid session is required.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '403':
        description: Caller is not a moderator/admin.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '409':
        description: A news item with that slug already exists.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'

byId:
  patch:
    summary: Update a news item, e.g. to publish it (moderator/admin only)
    operationId: updateNews
    tags: [news]
    security:
      - bearerAuth: []
    parameters:
      - name: newsId
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title: { type: string }
              body: { type: string }
              status: { type: string, enum: [draft, published] }
    responses:
      '200':
        description: Updated news item.
        content:
          application/json:
            schema:
              $ref: '../schemas/News.yaml'
      '400':
        description: Invalid news id or request body.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '403':
        description: Caller is not a moderator/admin.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '404':
        description: No news item with that id (or not authorized).
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
  delete:
    summary: Delete a news item (moderator/admin only)
    operationId: deleteNews
    tags: [news]
    security:
      - bearerAuth: []
    parameters:
      - name: newsId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '204':
        description: Deleted.
      '400':
        description: Invalid news id.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '404':
        description: No news item with that id (or not authorized).
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
