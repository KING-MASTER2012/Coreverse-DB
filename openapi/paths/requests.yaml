accept:
  post:
    summary: Accept a pending membership request (join request or invite/ownership-transfer target)
    operationId: acceptMembershipRequest
    tags: [requests]
    security:
      - bearerAuth: []
    parameters:
      - name: requestId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: Request accepted and applied.
        content:
          application/json:
            schema:
              $ref: '../schemas/Ok.yaml'
      '400':
        description: Invalid request id.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '401':
        description: A valid session is required.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '403':
        description: Caller is not a relevant party to this request.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '404':
        description: No request with that id.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '409':
        description: Request has already been decided.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'

reject:
  post:
    summary: Reject a pending membership request
    operationId: rejectMembershipRequest
    tags: [requests]
    security:
      - bearerAuth: []
    parameters:
      - name: requestId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: Request rejected.
        content:
          application/json:
            schema:
              $ref: '../schemas/Ok.yaml'
      '400':
        description: Invalid request id.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '401':
        description: A valid session is required.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '403':
        description: Caller is not a relevant party to this request.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '404':
        description: No request with that id.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '409':
        description: Request has already been decided.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'

cancel:
  post:
    summary: Cancel a pending membership request (initiator only)
    operationId: cancelMembershipRequest
    tags: [requests]
    security:
      - bearerAuth: []
    parameters:
      - name: requestId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: Request cancelled.
        content:
          application/json:
            schema:
              $ref: '../schemas/Ok.yaml'
      '400':
        description: >
          Invalid request id, or no *pending* request exists with that id
          (already decided, already cancelled, or never existed --
          cancel_request does not distinguish these cases).
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '401':
        description: A valid session is required.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '403':
        description: Caller is not the initiator.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
