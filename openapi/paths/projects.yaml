list:
  get:
    summary: List projects visible to the caller (owned, or via team membership)
    operationId: listProjects
    tags: [projects]
    security:
      - bearerAuth: []
    parameters:
      - name: team_id
        in: query
        required: false
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: Visible projects.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/Project.yaml'
      '400':
        description: Invalid team_id.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
  post:
    summary: Register a project (archive already uploaded to Storage)
    operationId: createProject
    tags: [projects]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, archive_path, archive_size_bytes, archive_sha256]
            properties:
              name: { type: string }
              description: { type: string, type: ["string", "null"] }
              team_id: { type: string, format: uuid, type: ["string", "null"] }
              archive_path: { type: string }
              archive_size_bytes: { type: integer, format: int64 }
              archive_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
    responses:
      '201':
        description: Created project.
        content:
          application/json:
            schema:
              $ref: '../schemas/Project.yaml'
      '400':
        description: Invalid request body.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '401':
        description: A valid session is required.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'

byId:
  patch:
    summary: Update a project (owner only)
    operationId: updateProject
    tags: [projects]
    security:
      - bearerAuth: []
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name: { type: string }
              description: { type: string, type: ["string", "null"] }
    responses:
      '200':
        description: Updated project.
        content:
          application/json:
            schema:
              $ref: '../schemas/Project.yaml'
      '400':
        description: Invalid project id or request body.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '404':
        description: No project with that id, or the caller is not the owner.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
  delete:
    summary: Delete a project (owner only)
    operationId: deleteProject
    tags: [projects]
    security:
      - bearerAuth: []
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '204':
        description: Project deleted.
      '400':
        description: Invalid project id.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '404':
        description: No project with that id, or the caller is not the owner.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'

download:
  get:
    summary: Get a short-lived signed download URL for the project archive
    operationId: getProjectDownloadUrl
    tags: [projects]
    security:
      - bearerAuth: []
    description: >
      project-archives is a private bucket -- URLs are minted on request
      (5 minute TTL) rather than being included in the regular project
      representation, since access requires checking identity.projects
      visibility (owner or team member) first.
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: Signed URL.
        content:
          application/json:
            schema:
              type: object
              required: [url, expires_in]
              properties:
                url: { type: string, format: uri }
                expires_in: { type: integer, description: Seconds until the URL expires. }
      '400':
        description: Invalid project id.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '404':
        description: No project with that id, or the caller has no access.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
