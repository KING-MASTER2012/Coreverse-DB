name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, independent of any push -- catches newly-disclosed query
    # patterns against code that hasn't changed.
    - cron: "23 4 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # TS covers src/, orval.config.ts, etc. JS covers the Deno Edge
        # Functions (CodeQL's javascript extractor understands Deno/TS
        # syntax well enough for its purposes despite Deno not being a
        # first-class "language").
        language: ["typescript", "javascript"]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
