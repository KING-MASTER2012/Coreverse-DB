name: SQLFluff

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".sqlfluff"
      - ".github/workflows/sqlfluff.yml"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - ".sqlfluff"
      - ".github/workflows/sqlfluff.yml"
  workflow_dispatch:

jobs:
  lint:
    name: Lint migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install sqlfluff

      - name: sqlfluff lint
        run: sqlfluff lint supabase/migrations
