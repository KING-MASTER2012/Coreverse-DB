name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.12.0"

jobs:
  # ---------------------------------------------------------------------
  # openapi/ is the contract. Lint it on its own so a broken spec fails
  # fast, before we even try to generate a client from it.
  # ---------------------------------------------------------------------
  openapi-lint:
    name: Lint OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Redocly lint
        run: pnpm exec redocly lint openapi/openapi.yaml

  # ---------------------------------------------------------------------
  # The generated client (src/generated/**) must always match what Orval
  # would produce from the current openapi/**. `pnpm run verify` runs
  # generate -> git diff --exit-code -> typecheck, so a PR that edits the
  # spec without regenerating (or hand-edits generated/**) fails here.
  # ---------------------------------------------------------------------
  client-verify:
    name: Verify generated client (no drift) + typecheck
    runs-on: ubuntu-latest
    needs: openapi-lint
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: pnpm run verify (generate, drift check, typecheck)
        run: pnpm run verify

      - name: Show diff on failure
        if: failure()
        run: git diff src/generated | head -c 20000

  # ---------------------------------------------------------------------
  # Edge Function schemas.ts <-> schemas.test.ts (pure Zod unit tests,
  # no Supabase client / network dependency beyond what deno.json grants).
  # ---------------------------------------------------------------------
  deno-unit:
    name: Deno unit tests (Zod schemas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: deno task test
        run: deno task test

      - name: deno fmt --check
        run: deno fmt --check supabase/functions/

  # ---------------------------------------------------------------------
  # pgTAP: spins up a local Supabase (Docker) stack, applies
  # supabase/migrations/**, and runs supabase/tests/{database,rls}/**.
  # This is intentionally a separate job from deno-unit: pgTAP tests the
  # database itself and needs a running Postgres, the Zod tests don't.
  # ---------------------------------------------------------------------
  supabase-pgtap:
    name: Supabase pgTAP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (applies migrations)
        run: supabase start

      - name: Lint database schema
        run: supabase db lint

      - name: Run pgTAP tests (supabase/tests/**)
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: supabase stop

  # ---------------------------------------------------------------------
  # Single required status check to point branch protection at.
  # ---------------------------------------------------------------------
  ci-required:
    name: CI required checks
    if: always()
    runs-on: ubuntu-latest
    needs: [openapi-lint, client-verify, deno-unit, supabase-pgtap]
    steps:
      - name: Fail if any dependency failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required jobs failed." >&2
            exit 1
          fi
