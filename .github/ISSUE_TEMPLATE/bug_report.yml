name: 🐛 Bug Report
description: Report something in Coreverse DB (API, Edge Functions, migrations, or generated client) that isn't working as expected.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first to avoid duplicates.

  - type: dropdown
    id: domain
    attributes:
      label: Domain
      description: Which part of Coreverse DB does this affect?
      options:
        - releases
        - identity (profiles / teams / requests)
        - projects
        - content (news / polls / discussions)
        - docs
        - openapi / generated client (src/)
        - infrastructure (migrations / RLS / storage)
        - other / not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug. Include request/response payloads or stack traces if relevant.
      placeholder: Tell us what you saw...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps (or a curl / client snippet) that reproduce the issue.
      placeholder: |
        1. Call `POST /teams` with ...
        2. Observe ...
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Package version (`@coreverse/db-client`), or the commit SHA / branch you're on.
      placeholder: e.g. 0.1.0, or commit 8655e29
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local (supabase start / Deno local dev)
        - Deployed Supabase project
        - Coreverse Launcher
        - Coreverse Website
        - Other
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Edge Function logs, Postgres errors, or console output. This is automatically formatted as code, no need for backticks.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this hasn't been reported yet.
          required: true
        - label: This does not involve leaking real credentials, tokens, or user data (report security issues privately instead — see SECURITY.md).
          required: true
